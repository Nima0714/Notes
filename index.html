
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  color: #20243a;
  transition: .3s;
}

body.dark {
  background: #151827;
  color: white;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
  background: #ffffff;
  box-shadow: 0 2px 10px #0000000d;
}

.dark header {
  background: #202438;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 23px;
  font-weight: bold;
}

.logo-icon {
  font-size: 29px;
}

button {
  border: none;
  padding: 11px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
}

.theme-btn {
  background: #eef0f8;
  color: #222;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 25px 18px;
}

.welcome {
  margin-bottom: 25px;
}

.welcome h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

.welcome p {
  color: #85899b;
}

.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  margin-bottom: 20px;
  font-size: 15px;
  outline: none;
}

.dark .search,
.dark textarea,
.dark input {
  background: #252a40;
  color: white;
  border-color: #414761;
}

.add-btn {
  background: #536dfe;
  color: white;
  width: 100%;
  padding: 15px;
  font-weight: bold;
  margin-bottom: 25px;
}

.section-title {
  margin-bottom: 15px;
  font-size: 19px;
}

.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.note {
  background: white;
  border-radius: 15px;
  padding: 18px;
  min-height: 140px;
  box-shadow: 0 3px 12px #00000008;
}

.dark .note {
  background: #202438;
}

.note h3 {
  margin-bottom: 10px;
}

.note p {
  color: #85899b;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.note-actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.note-actions button {
  background: #eef0ff;
  color: #536dfe;
}

.empty {
  text-align: center;
  padding: 45px 10px;
  color: #85899b;
}

.editor {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.editor-box {
  background: white;
  color: #20243a;
  width: 100%;
  max-width: 500px;
  padding: 22px;
  border-radius: 17px;
}

.dark .editor-box {
  background: #202438;
  color: white;
}

.editor-box h2 {
  margin-bottom: 18px;
}

.editor-box input,
.editor-box textarea {
  width: 100%;
  padding: 13px;
  margin-bottom: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  font-family: inherit;
}

.editor-box textarea {
  height: 180px;
  resize: vertical;
}

.save-btn {
  background: #536dfe;
  color: white;
}

.cancel-btn {
  background: #eee;
  color: #222;
}

footer {
  text-align: center;
  padding: 30px;
  color: #999;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <span class="logo-icon">📖</span>
    <span>Notes</span>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">🌙 Theme</button>
</header>

<main class="container">

  <div class="welcome">
    <h1>My Notes 📝</h1>
    <p>Your thoughts, organized in one place.</p>
  </div>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 Search your notes..."
    oninput="renderNotes()"
  >

  <button class="add-btn" onclick="openEditor()">
    + Create New Note
  </button>

  <h2 class="section-title">All Notes</h2>

  <div class="notes-grid" id="notesGrid"></div>

</main>

<footer>
  Made with ❤️ | Notes App
</footer>

<div class="editor" id="editor">
  <div class="editor-box">
    <h2 id="editorTitle">Create Note</h2>

    <input id="noteTitle" placeholder="Note title...">

    <textarea id="noteContent"
      placeholder="Write your thoughts here..."></textarea>

    <button class="save-btn" onclick="saveNote()">Save Note</button>
    <button class="cancel-btn" onclick="closeEditor()">Cancel</button>
  </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("myNotes")) || [];
let editingId = null;

function saveData() {
  localStorage.setItem("myNotes", JSON.stringify(notes));
}

function openEditor(id = null) {
  editingId = id;
  const editor = document.getElementById("editor");

  if (id !== null) {
    const note = notes.find(n => n.id === id);
    document.getElementById("noteTitle").value = note.title;
    document.getElementById("noteContent").value = note.content;
    document.getElementById("editorTitle").textContent = "Edit Note";
  } else {
    document.getElementById("noteTitle").value = "";
    document.getElementById("noteContent").value = "";
    document.getElementById("editorTitle").textContent = "Create Note";
  }

  editor.style.display = "flex";
}

function closeEditor() {
  document.getElementById("editor").style.display = "none";
}

function saveNote() {
  const title = document.getElementById("noteTitle").value.trim();
  const content = document.getElementById("noteContent").value.trim();

  if (!title && !content) {
    alert("Please write something!");
    return;
  }

  if (editingId !== null) {
    const note = notes.find(n => n.id === editingId);
    note.title = title || "Untitled";
    note.content = content;
  } else {
    notes.unshift({
      id: Date.now(),
      title: title || "Untitled",
      content: content
    });
  }

  saveData();
  renderNotes();
  closeEditor();
}

function deleteNote(id) {
  if (confirm("Delete this note?")) {
    notes = notes.filter(n => n.id !== id);
    saveData();
    renderNotes();
  }
}

function renderNotes() {
  const grid = document.getElementById("notesGrid");
  const query = document.getElementById("search").value.toLowerCase();

  const filtered = notes.filter(n =>
    n.title.toLowerCase().includes(query) ||
    n.content.toLowerCase().includes(query)
  );

  grid.innerHTML = "";

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">📝<br><br>No notes found.<br>Create your first note!</div>';
    return;
  }

  filtered.forEach(note => {
    const card = document.createElement("div");
    card.className = "note";

    const title = document.createElement("h3");
    title.textContent = note.title;

    const content = document.createElement("p");
    content.textContent = note.content;

    const actions = document.createElement("div");
    actions.className = "note-actions";

    const edit = document.createElement("button");
    edit.textContent = "✏️ Edit";
    edit.onclick = () => openEditor(note.id);

    const del = document.createElement("button");
    del.textContent = "🗑️ Delete";
    del.onclick = () => deleteNote(note.id);

    actions.append(edit, del);
    card.append(title, content, actions);
    grid.appendChild(card);
  });
}

function toggleTheme() {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "notesTheme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

if (localStorage.getItem("notesTheme") === "dark") {
  document.body.classList.add("dark");
}

renderNotes();
</script>

</body>
</html>
